name: AI VIDEO STUDIO - manual smoke checks
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  AIVS_CI_CAPTION_FONT_URL: https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
  AIVS_CI_CAPTION_FONT_SHA256: 68a3fc98800b2a27b371f2fb79991daf3633bd89309d4ffaa6946fd587f375b5
jobs:
  offline-prototype-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FFmpeg media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check runtime
        run: |
          node --version
          python --version
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Local caption dependencies and Japanese font
        run: |
          python -m pip install numpy -r requirements-media.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Cloud mock tests
        run: cd cloud && node --test tests/*.test.mjs
      - name: FFmpeg engine tests
        run: python -m unittest engine.test_media_tools engine.test_manifest engine.test_caption_raster cloud.processor.test_r2_run -v
      - name: Audio smoke (requires NumPy)
        run: |
          cd prototypes/audio && python -m unittest test_mix -v
      - name: Offline multi-camera proposal tests
        run: node --test packages/edit-planner/auto-edit.test.mjs
      - name: FFmpeg signal extraction and end-to-end test
        run: python -m unittest engine.test_local_signals engine.test_autoplan_pipeline -v
      - name: Portable project save/reopen and protected FFmpeg handoff
        run: |
          node --test packages/project/*.test.mjs
          python -m unittest engine.test_project_pipeline -v
          python -m unittest engine.test_saved_project_audio -v
          python -m unittest engine.test_output_qa -v
          python -m unittest engine.test_saved_sync -v
          python -m unittest engine.test_saved_first_cut -v
          python -m unittest engine.test_preview_saved_clip -v
      - name: Local editor API and edit operations (not browser acceptance)
        run: node --test apps/local-editor/*.test.mjs
      - name: Standalone device lab syntax check (not physical device validation)
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import re
          p=Path('prototypes/device-lab/DEVICE_LAB.html').read_text(encoding='utf8')
          s=re.search(r'<script>(.*?)</script>',p,re.S)
          assert s, 'script missing'
          Path('/tmp/aivs-device-lab-check.js').write_text(s.group(1), encoding='utf8')
          PYCODE
          node --check /tmp/aivs-device-lab-check.js

      - name: Browser audio-mix diagnostic static checks (not mobile acceptance)
        run: node --test prototypes/device-lab/audio-mix.test.mjs

      - name: Browser iOS audio-buffer compatibility smoke (static only)
        run: node --test prototypes/device-lab/audio-compat.test.mjs

  synthetic-browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install bounded browser test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          python -m pip install Pillow==13.0.0 fonttools==4.61.1 numpy==2.3.5
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Require installed Chrome, media tools and caption font
        run: |
          chrome_path="$(command -v google-chrome)" || { echo 'BLOCKED: installed Google Chrome unavailable'; exit 2; }
          python_path="$(command -v python)"
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
          test_root="$(mktemp -d "$RUNNER_TEMP/aivs-browser-acceptance.XXXXXX")"
          printf 'TMPDIR=%s\n' "$test_root" >> "$GITHUB_ENV"
          font_path="$test_root/NotoSansCJKjp-Regular.otf"
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            --output "$font_path" "$AIVS_CI_CAPTION_FONT_URL"
          printf '%s  %s\n' "$AIVS_CI_CAPTION_FONT_SHA256" "$font_path" | sha256sum --check --strict
          printf 'AIVS_BROWSER_EXECUTABLE=%s\nAIVS_PYTHON=%s\nAIVS_CAPTION_FONT=%s\n' \
            "$chrome_path" "$python_path" "$font_path" >> "$GITHUB_ENV"
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          "$chrome_path" --version
          node --version
          python --version
          ffmpeg -version | head -1
          ffprobe -version | head -1
          node -e "console.log('Playwright',require('playwright/package.json').version)"
          python -c "from importlib.metadata import version; print({name:version(name) for name in ('Pillow','fonttools','numpy')})"
      - name: Existing editor real-browser acceptance (synthetic media only)
        run: timeout --signal=TERM --kill-after=10s 300s node apps/local-editor/browser-acceptance.mjs
      - name: Two-workspace source relink real-browser acceptance (synthetic media only)
        run: timeout --signal=TERM --kill-after=10s 300s node apps/local-editor/browser-relink-acceptance.mjs
      - name: Saved-cut visual preview real-browser acceptance (synthetic media only)
        run: timeout --signal=TERM --kill-after=10s 300s node apps/local-editor/browser-preview-acceptance.mjs
      - name: Retained upload recovery and first-cut export real-browser acceptance (synthetic media only)
        run: timeout --signal=TERM --kill-after=10s 300s node apps/local-editor/browser-import-recovery-acceptance.mjs
      - name: Remove browser test temporary files
        if: always()
        run: |
          if [ -n "${TMPDIR:-}" ] && [[ "$TMPDIR" == "$RUNNER_TEMP"/aivs-browser-acceptance.* ]]; then
            rm -rf -- "$TMPDIR"
          fi

  windows-synthetic-media-acceptance:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install synthetic test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          python -m pip install Pillow==13.0.0 fonttools==4.61.1 numpy==2.3.5
      - name: Verify WinGet 9.0.2 package and run discovery with a restricted launch PATH
        run: |
          $python = Join-Path $env:pythonLocation 'python.exe'
          if (!(Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Configured Python unavailable' }
          $scratch = Join-Path $env:RUNNER_TEMP 'aivs Windows media'
          $fixtureLocalAppData = Join-Path $scratch 'LocalAppData'
          $package = Join-Path $fixtureLocalAppData 'Microsoft\WinGet\Packages\Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe'
          $archive = Join-Path $scratch 'ffmpeg-9.0.2-full_build.zip'
          New-Item -ItemType Directory -Path $scratch | Out-Null
          # URL and digest from the Gyan.FFmpeg 9.0.2 x64 WinGet manifest.
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-full_build.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '759D0A9831C436A0EB331AD36F236C06CB04AAA0005DA46571F0E9D3D9206F6B') {
            throw 'FFmpeg package digest mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          $bin = Join-Path $package 'ffmpeg-9.0.2-full_build\bin'
          $launchPath = $env:Path
          $localAppData = $env:LOCALAPPDATA
          try {
            $env:Path = Split-Path -Parent $python
            $env:LOCALAPPDATA = $fixtureLocalAppData
            $resolved = & $python -m engine.media_tools --resolve | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Windows WinGet discovery failed' }
            foreach ($tool in 'ffmpeg', 'ffprobe') {
              $expected = (Resolve-Path -LiteralPath (Join-Path $bin "$tool.exe")).Path
              if ($resolved.$tool -ne $expected) { throw "Unexpected resolved $tool" }
              $firstLine = & $expected -version | Select-Object -First 1
              if ($LASTEXITCODE -ne 0 -or $firstLine -notmatch "^$tool version 9\.0\.2") { throw "Unexpected $tool version" }
              Write-Output $firstLine
            }
          } finally {
            $env:Path = $launchPath
            $env:LOCALAPPDATA = $localAppData
          }
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (!(Test-Path -LiteralPath $chrome -PathType Leaf)) { throw 'Installed Google Chrome unavailable' }
          $font = Join-Path $scratch 'NotoSansCJKjp-Regular.otf'
          Invoke-WebRequest -Uri $env:AIVS_CI_CAPTION_FONT_URL -OutFile $font
          if ((Get-FileHash -LiteralPath $font -Algorithm SHA256).Hash -ne $env:AIVS_CI_CAPTION_FONT_SHA256) {
            throw 'Caption font digest mismatch'
          }
          $testTemp = Join-Path $scratch '合成 素材'
          New-Item -ItemType Directory -Path $testTemp | Out-Null
          "AIVS_FFMPEG_DIR=$bin" >> $env:GITHUB_ENV
          "AIVS_PYTHON=$python" >> $env:GITHUB_ENV
          "AIVS_BROWSER_EXECUTABLE=$chrome" >> $env:GITHUB_ENV
          "AIVS_CAPTION_FONT=$font" >> $env:GITHUB_ENV
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH
          Write-Output "Runner image: $env:ImageOS $env:ImageVersion"
          node --version
          python --version
      - name: Windows JSON, media tool discovery and analysis tests
        run: python -m unittest engine.test_media_tools engine.test_saved_first_cut engine.test_saved_sync -v
      - name: Windows editor HTTP media preflight
        run: node --test apps/local-editor/media-preflight.test.mjs apps/local-editor/google-photos-server.test.mjs apps/local-editor/system-browser.test.mjs
      - name: Windows Chrome upload recovery, first cut, export and replay (synthetic media)
        env:
          PYTHONUTF8: '0'
          PYTHONIOENCODING: cp932
        run: node apps/local-editor/browser-import-recovery-acceptance.mjs
      - name: Windows Chrome Google Photos selection to draft, export and replay (simulated Google responses)
        env:
          PYTHONUTF8: '0'
          PYTHONIOENCODING: cp932
        run: node apps/local-editor/browser-google-photos-acceptance.mjs

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI VIDEO STUDIO ローカル編集</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141d;color:#edf1fa;font-family:system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:20px}h1{font-size:24px;margin:0}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#a6b1c4;font-size:13px}section{background:#1b2331;border:1px solid #303b4d;border-radius:14px;padding:16px;margin:16px 0}button,.file-label{background:#2b374b;color:white;border:1px solid #52617a;border-radius:8px;padding:12px 16px;min-height:44px;font:inherit;cursor:pointer;display:inline-block}button.primary{background:#4c63ef;border-color:#7991ff}button:disabled{opacity:.5;cursor:wait}input,select,textarea{background:#111a28;color:white;border:1px solid #52617a;border-radius:7px;padding:10px;font:inherit;max-width:100%}input[type=number]{width:115px}input[type=file]{max-width:100%;font-size:14px}textarea{width:100%;min-height:70px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}label{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}.field{display:block;margin:10px 0}.preview{position:relative;background:black;border-radius:10px;overflow:hidden}video{display:block;width:100%;max-height:390px}.caption{position:absolute;bottom:13%;left:10%;width:80%;text-align:center;color:white;text-shadow:1px 1px black;pointer-events:none}.caption span{background:#000b;padding:4px 10px}#notice{min-height:25px;color:#bcd1ff;white-space:pre-wrap}#clips{list-style:none;padding:0;display:flex;gap:8px;overflow:auto}#clips button{white-space:nowrap}#clips .selected{border:2px solid #899cff}.bus{padding:10px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}.bus input[type=range]{width:120px}.tools{display:flex;gap:8px;flex-wrap:wrap}a{color:#b0c5ff}small{font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:12px}section{padding:12px}.bus{flex-wrap:wrap}}
</style><main><header><div><h1>AI VIDEO STUDIO</h1><div class="muted">ローカル編集・開発版</div></div><div class="row"><button id="undo">戻す</button><button id="redo">やり直す</button><button id="save-project">プロジェクト保存</button><label>開く<input id="open-project" type="file" accept=".json"></label></div></header>
<button id="conflict-save" hidden>未保存の変更を保存</button><p id="notice" role="status" aria-live="polite">保存内容を読み込んでいます</p>
<section><div class="row"><label>動画を追加<input id="video-files" type="file" multiple accept="video/mp4,video/quicktime,.mkv,.webm"></label><label>名前<input id="project-name" maxlength="160"></label></div><p class="muted">素材はこのPC内の専用フォルダに保存します。元ファイルは変更しません。</p></section>
<div class="grid"><div><section><div class="preview"><video id="preview" controls playsinline></video><div id="caption-preview" class="caption"></div></div><p class="muted">素材の簡易プレビューです。音量と仕上がりは完成動画で確認できます。</p><ol id="clips"></ol><div class="tools"><button id="add-clip">カット追加</button><button id="split">ここで分割</button><button id="move-left">前へ</button><button id="move-right">後ろへ</button></div></section><section><h2>完成動画</h2><button id="render" class="primary">完成動画を作る</button><span id="render-state" class="muted"></span><video id="output" controls playsinline hidden></video><a id="download" hidden download="aivs-edited.mp4">MP4を保存</a></section></div>
<div><section><h2>選んだカット</h2><label class="field">カメラ<select id="camera"></select></label><div class="row"><label>開始 秒<input id="trim-start" type="number" min="0" step="0.1"></label><label>使う長さ 秒<input id="duration" type="number" min="0.2" step="0.1"></label><label>速度<select id="speed"><option value="0.5">0.5倍</option><option value="1">1倍</option><option value="2">2倍</option><option value="4">4倍</option></select></label></div><label class="field">テロップ<textarea id="caption" maxlength="200" placeholder="表示する言葉"></textarea></label><button id="apply" class="primary">このカットを保存</button><hr><label>このカメラの同期位置 秒<input id="sync-offset" type="number" step="0.1"></label><label class="field"><input id="sync-confirm" type="checkbox">映像と音で同期位置を確認した</label><button id="apply-sync">同期位置を保存</button><p class="muted">追加カメラは同期確認後に使えます。音声の同期候補を下で調べられます。画面分割の操作は今後対応します。</p></section>
<section><h2>音声</h2><div id="buses"></div><label class="field">BGM<input id="bgm-file" type="file" accept="audio/*"></label><label class="field">ナレーション音源<input id="narration-file" type="file" accept="audio/*"></label><label class="field">効果音<input id="sfx-file" type="file" accept="audio/*"></label><p class="muted">利用権のある音源を選んでください。読み込んだ音源は先頭へ配置します。音声生成には未対応です。</p></section></div></div></main>
<script type="module" nonce="__NONCE__">
import {applyClipEdit,splitClip,moveClip,appendClip,cameraSourceIn} from '/editor-edits.mjs';
import {reviewTarget,inspectionMessage,inspectionScope,isWholeOutputFinding} from '/editor-qa.mjs';
import {mountAudioPanel} from '/audio-panel.mjs';
import {mountSyncPanel} from '/sync-panel.mjs';
import {mountFirstCutPanel} from '/first-cut-panel.mjs';
const token='__TOKEN__',$=id=>document.getElementById(id);let state,selected=0,working=false,poll;
const names={source:'元音声',narration:'ナレーション',bgm:'BGM',sfx:'効果音'};
function notice(message){$('notice').textContent=message;}
async function api(path,{method='GET',body,headers={}}={}){const r=await fetch(path,{method,body,headers:{'X-AIVS-Token':token,'X-AIVS-Revision':String(state?.session?.project?.revision??0),...headers}});const data=await r.json();if(!r.ok){const e=new Error(data.error||'処理に失敗しました');e.status=r.status;throw e;}return data;}
function sourceUrl(asset){return '/media/'+asset+'?token='+token;}
const audioContainer=document.createElement('div');audioContainer.id='audio-clips';$('buses').after(audioContainer);
const audioPanel=mountAudioPanel({container:audioContainer,current:()=>state,commit:edit,act,mediaUrl:sourceUrl});
const syncContainer=document.createElement('div');syncContainer.id='sync-candidates';$('apply-sync').after(syncContainer);
const syncPanel=mountSyncPanel({container:syncContainer,current:()=>state,request:api,act,refresh:async()=>{state=await api('/api/state');show();},mediaUrl:sourceUrl,notice});
const firstCutContainer=document.createElement('section');firstCutContainer.id='first-cut';$('video-files').closest('section').after(firstCutContainer);
const firstCutPanel=mountFirstCutPanel({container:firstCutContainer,current:()=>state,request:api,act,refresh:async()=>{state=await api('/api/state');show();},mediaUrl:sourceUrl,notice});
function show(){const p=state.session.project;selected=Math.min(selected,Math.max(0,p.timeline.length-1));$('project-name').value=p.name;
 $('undo').disabled=!state.session.undo.length;$('redo').disabled=!state.session.redo.length;
 $('clips').replaceChildren();p.timeline.forEach((c,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.textContent=(i+1)+' · '+(c.durationSec/c.speed).toFixed(1)+'秒';b.className=i===selected?'selected':'';b.onclick=()=>{selected=i;show();};li.append(b);$('clips').append(li);});
 $('camera').replaceChildren();for(const s of p.sourceRefs.filter(s=>s.mediaKind==='video')){const o=document.createElement('option');o.value=s.assetId;o.textContent=state.sources.find(x=>x.assetId===s.assetId)?.label||s.assetId;$('camera').append(o);}
 const c=p.timeline[selected];for(const id of ['apply','split','add-clip','move-left','move-right','render'])$(id).disabled=!c;
 $('render').disabled=!c||state.job.status==='RUNNING'||state.sync?.status==='RUNNING'||state.firstCut?.status==='RUNNING';
 if(c){$('camera').value=c.sourceId;$('trim-start').value=c.sourceInSec;$('duration').value=c.durationSec;$('speed').value=String(c.speed);$('caption').value=c.effects.find(e=>e.type==='caption')?.parameters.text||'';
 const url=sourceUrl(c.sourceId);if($('preview').getAttribute('src')!==url)$('preview').src=url;
 $('preview').playbackRate=c.speed;try{$('preview').currentTime=c.sourceInSec;}catch{}
 $('caption-preview').replaceChildren();if($('caption').value){const label=document.createElement('span');label.textContent=$('caption').value;$('caption-preview').append(label);}showSync();}
 $('buses').replaceChildren();for(const bus of Object.keys(names)){const row=document.createElement('div');row.className='bus';const label=document.createElement('label');label.textContent=names[bus];const gain=document.createElement('input');gain.type='range';gain.min='-40';gain.max='6';gain.step='1';gain.id='gain-'+bus;gain.value=p.audioBuses[bus].gainDb;gain.setAttribute('aria-label',names[bus]+' 音量');const value=document.createElement('span');value.textContent=gain.value+' dB';gain.oninput=()=>{value.textContent=gain.value+' dB';};gain.onchange=()=>act(async()=>{const q=structuredClone(state.session.project);q.audioBuses[bus].gainDb=Number(gain.value);await edit(q);});
 const mute=document.createElement('input');mute.type='checkbox';mute.id='mute-'+bus;mute.checked=p.audioBuses[bus].muted;const ml=document.createElement('label');ml.append(mute,document.createTextNode('消音'));mute.onchange=()=>act(async()=>{const q=structuredClone(state.session.project);q.audioBuses[bus].muted=mute.checked;await edit(q);});label.append(gain,value);row.append(label,ml);$('buses').append(row);}
 audioPanel.show();
 syncPanel.show();
 firstCutPanel.show();
}
function showSync(){const s=state.session.project.sourceRefs.find(s=>s.assetId===$('camera').value);if(!s)return;$('sync-offset').value=s.offsetSec;$('sync-confirm').checked=['master','verified'].includes(s.syncStatus);}
async function act(action){if(working)return;working=true;try{notice('処理中…');await action();show();notice('端末内に保存済み');}catch(e){if(e.status===409&&e.message.includes('REVISION_CONFLICT')){try{state=await api('/api/state');show();if(e.draft){$('conflict-save').hidden=false;$('conflict-save').onclick=()=>downloadJson(e.draft,'unsaved-edit.aivs.json');}notice('別の画面の更新を読み直しました。未保存の変更は保存ボタンから取り出せます。');}catch{notice(e.message);}}else notice(e.message);}finally{working=false;}}
async function edit(p){try{state=await api('/api/edit',{method:'POST',body:JSON.stringify(p)});}catch(e){e.draft=JSON.stringify({...state.session,project:p},null,2);throw e;}}
function downloadJson(json,name){const url=URL.createObjectURL(new Blob([json],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function upload(input,kind){for(const file of input.files){notice(file.name+' を端末内へ読み込んでいます');state=await api('/api/import?kind='+kind,{method:'POST',headers:{'X-File-Name':encodeURIComponent(file.name)},body:file});}input.value='';}
$('video-files').onchange=()=>act(()=>upload($('video-files'),'video'));for(const kind of ['bgm','narration','sfx'])$(kind+'-file').onchange=()=>act(()=>upload($(kind+'-file'),kind));
$('project-name').onchange=()=>act(async()=>{const p=structuredClone(state.session.project);p.name=$('project-name').value;await edit(p);});
$('camera').onchange=()=>{try{$('trim-start').value=cameraSourceIn(state.session.project,selected,$('camera').value);}catch(e){$('trim-start').value='';notice(e.message);}showSync();};
$('apply').onclick=()=>act(async()=>{const source=state.session.project.sourceRefs.find(s=>s.assetId===$('camera').value);
 if(!['master','verified'].includes(source?.syncStatus))throw new Error('先にこのカメラの同期位置を確認・保存してください');
 if($('trim-start').value===''||$('duration').value==='')throw new Error('使う場面の開始と長さを入力してください');
 await edit(applyClipEdit(state.session.project,selected,{sourceId:$('camera').value,sourceInSec:Number($('trim-start').value),durationSec:Number($('duration').value),speed:Number($('speed').value),caption:$('caption').value.trim()}));});
$('apply-sync').onclick=()=>act(async()=>{const p=structuredClone(state.session.project),s=p.sourceRefs.find(s=>s.assetId===$('camera').value);s.offsetSec=Number($('sync-offset').value);s.syncStatus=$('sync-confirm').checked?'verified':'unverified';await edit(p);});
$('add-clip').onclick=()=>act(async()=>{const p=appendClip(state.session.project,$('camera').value,'clip_'+crypto.randomUUID().replaceAll('-',''),{withSourceAudio:true});selected=p.timeline.length-1;await edit(p);});
$('split').onclick=()=>act(async()=>{const c=state.session.project.timeline[selected];await edit(splitClip(state.session.project,selected,$('preview').currentTime-c.sourceInSec,'clip_'+crypto.randomUUID().replaceAll('-','')));});
for(const [id,d] of [['move-left',-1],['move-right',1]])$(id).onclick=()=>act(async()=>{const to=selected+d;if(to<0||to>=state.session.project.timeline.length)return;const p=moveClip(state.session.project,selected,d);selected=to;await edit(p);});
for(const id of ['undo','redo'])$(id).onclick=()=>act(async()=>{state=await api('/api/'+id,{method:'POST'});});
$('save-project').onclick=()=>{const blob=new Blob([JSON.stringify(state.session,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ai-video-project.aivs.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('open-project').onchange=()=>act(async()=>{const file=$('open-project').files[0];if(!file)return;state=await api('/api/open',{method:'POST',body:await file.text()});$('open-project').value='';});
const quality=document.createElement('div');quality.id='quality-review';$('download').after(quality);
const findingNames={BLACK_INTERVAL:'黒い映像の可能性',SILENCE_WHILE_AUDIO_SELECTED:'選択した音声が無音',SILENCE_REQUIRES_CONTEXT:'無音区間',NEAR_SAMPLE_CLIPPING:'音量ピークが大きい',TRUE_PEAK_AT_OR_ABOVE_REFERENCE:'音量ピーク（サンプル間を含む）が確認目安以上（全編最大値・時刻未特定）',TRUE_PEAK_UNAVAILABLE:'サンプル間の音量ピークを測定できませんでした',STATIC_OR_FREEZE_INTERVAL:'静止画・フリーズの候補（意図した静止画の場合あり）',VARIABLE_FRAME_CADENCE:'フレーム間隔の変化（意図した可変間隔の場合あり）'};
function showQA(report){
 quality.replaceChildren();const heading=document.createElement('h3');heading.textContent='完成動画の技術検査';
 const explanation=document.createElement('p');explanation.className='muted';explanation.textContent=inspectionMessage(report);
 if(report.inspection?.schema!=='aivs-output-inspection-v1'||!['CHECKED_LIMITED','NEEDS_REVIEW','FAILED_TECHNICAL'].includes(report.inspection.status)){quality.append(heading,explanation);return;}
 const limits=document.createElement('p');limits.className='muted';limits.textContent=inspectionScope(report);
 const save=document.createElement('button');save.textContent='検査記録を保存';save.onclick=()=>downloadJson(JSON.stringify(report,null,2),'aivs-output-inspection.json');quality.append(heading,explanation,limits,save);
 for(const [i,f] of (report.inspection?.findings??[]).entries()){
   const whole=isWholeOutputFinding(f),row=document.createElement('p'),label=document.createElement('span');label.textContent=`${whole?'全編':`${f.startSec.toFixed(1)}–${f.endSec.toFixed(1)}秒`} ${findingNames[f.code]??f.code} `;
   const play=document.createElement('button');play.textContent=whole?'全編を確認':'完成動画で確認';play.onclick=()=>{$('output').currentTime=whole?0:f.startSec;$('output').play().catch(e=>notice(e.message));};
   row.append(label,play);
   if(!whole){
   const edit=document.createElement('button');edit.textContent='このカットを編集';edit.onclick=()=>{try{const target=reviewTarget(report,state.session.project,i);selected=target.clipIndex;show();const preview=$('preview');if(preview.readyState)preview.currentTime=target.sourceSec;else preview.addEventListener('loadedmetadata',()=>{preview.currentTime=target.sourceSec;},{once:true});$('apply').scrollIntoView({block:'center',behavior:'smooth'});notice('検出箇所のカットを表示しました。変更後はもう一度完成動画を作ってください。');}catch(e){notice(e.message);}};
   row.append(edit);
   }
   quality.append(row);
 }
 if(report.inspection?.omittedFindings){const p=document.createElement('p');p.textContent='検出箇所が多いため記録は256件までです。全編を再生して確認してください。';quality.append(p);}
}
function finished(job){if(job.status!=='PASS')return;const url=job.download+'?token='+token;$('output').src=url;$('output').hidden=false;$('download').href=url;$('download').hidden=false;$('render-state').textContent='完成動画を確認できます';
 quality.replaceChildren();api('/api/qa').then(report=>{if(state.job.id===job.id)showQA(report);}).catch(()=>{quality.textContent='この出力の詳細な検査記録はありません。再作成して検査できます。';});}
function watch(){clearInterval(poll);poll=setInterval(async()=>{try{const latest=await api('/api/job');state.job=latest;if(latest.status==='RUNNING')return;clearInterval(poll);$('render').disabled=false;if(latest.status!=='PASS'){notice(latest.error);$('render-state').textContent='作成できませんでした';return;}finished(latest);}catch(e){clearInterval(poll);notice(e.message);}},500);}
$('render').onclick=()=>act(async()=>{state.job=await api('/api/render',{method:'POST'});quality.replaceChildren();$('output').hidden=true;$('download').hidden=true;$('render-state').textContent='作成中。このPCのアプリを終了しないでください。';watch();});
api('/api/state').then(data=>{state=data;show();if(state.job.status==='RUNNING')watch();else finished(state.job);notice('端末内に保存済み');}).catch(e=>notice(e.message));
</script></html>
